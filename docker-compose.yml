# Optional localhost kit. The process binds 0.0.0.0 inside the container so Docker
# can publish the port; the host publish is pinned to 127.0.0.1. Auth stays on.
# Operator HTTP uses BURNBRAKE_OPERATOR_KEY from config.example.env (this env_file, not a copied .env). It must differ from BURNBRAKE_KEY.
# Do not change the host port to 0.0.0.0 without an ACL. That is a fund-drain risk.
services:
  burnbrake:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - config.example.env
    environment:
      BURNBRAKE_HOST: 0.0.0.0
      BURNBRAKE_ALLOW_PUBLIC_BIND: "1"
      BURNBRAKE_MOCK_UPSTREAM: "1"
      BURNBRAKE_LEDGER_PATH: /app/data/burnbrake.sqlite
    volumes:
      - ./data:/app/data
